# Builds the Android APK and publishes it on GitHub Releases, where /download and the in-app
# update check find it (ADR 0005).
# - Every push to main that touches the app releases the next patch version (v0.1.4 -> v0.1.5).
# - For a bigger jump, push a tag yourself: git tag v0.2.0 && git push origin v0.2.0
name: Android release

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "shared/**"
      - ".github/workflows/android-release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes close together must not both pick the same next version.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to find the last version

      - name: Pick the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            LAST="${LAST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST:-0.0.0}"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release settings
        env:
          KEYSTORE: ${{ secrets.MONETRA_KEYSTORE_BASE64 }}
          API_URL: ${{ vars.MONETRA_API_URL }}
        run: |
          # Without the same key every time, Android won't install an update over the last version.
          [ -n "$KEYSTORE" ] || { echo "::error::Secret MONETRA_KEYSTORE_BASE64 is missing"; exit 1; }
          case "$API_URL" in https://*) ;; *) echo "::error::Variable MONETRA_API_URL must be the https URL of the web app"; exit 1;; esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      # Includes the shared fixtures that the server's tests also run (shared/fixtures).
      - run: flutter test

      - name: Build signed APK
        env:
          KEYSTORE: ${{ secrets.MONETRA_KEYSTORE_BASE64 }}
          MONETRA_KEYSTORE_PASSWORD: ${{ secrets.MONETRA_KEYSTORE_PASSWORD }}
          MONETRA_KEY_ALIAS: ${{ secrets.MONETRA_KEY_ALIAS }}
          MONETRA_KEY_PASSWORD: ${{ secrets.MONETRA_KEY_PASSWORD }}
          API_URL: ${{ vars.MONETRA_API_URL }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MONETRA_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          VERSION="${{ steps.version.outputs.version }}"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --dart-define=API_URL="$API_URL"
          cp build/app/outputs/flutter-apk/app-release.apk monetra.apk

      # Creates the tag too when the run came from a push to main. A tag made with this
      # workflow's token doesn't start the workflow again.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: mobile/monetra.apk
          generate_release_notes: true
