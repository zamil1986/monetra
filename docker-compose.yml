services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: monetra
      POSTGRES_PASSWORD: monetra
      POSTGRES_DB: monetra
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monetra"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
